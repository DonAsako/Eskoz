name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: eskoz.settings.development
      # Dummy secret so settings load in CI; never used to sign anything real.
      DJANGO_SECRET_KEY: ci-dummy-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version-file: .python-version
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit (ruff, yamllint, gitleaks, django checks)
        # Runs "system"-language hooks (django-check, django-check-migrations)
        # against the uv-managed venv, which already has Django installed.
        run: uv run pre-commit run --all-files --show-diff-on-failure

  tests:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: eskoz.settings.ci
      DJANGO_SECRET_KEY: ci-dummy-secret-key-not-for-production
      POSTGRES_DB: eskoz_test
      POSTGRES_USER: eskoz
      POSTGRES_PASSWORD: eskoz
      DB_HOST: localhost
      DB_PORT: 5432
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eskoz_test
          POSTGRES_USER: eskoz
          POSTGRES_PASSWORD: eskoz
        ports:
          - 5432:5432
        # Wait until Postgres is ready before the test step runs.
        options: >-
          --health-cmd "pg_isready -U eskoz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version-file: .python-version
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Run Django tests
        # -t . sets the unittest top-level dir to the repo root so the
        # apps.*.models packages import under their real dotted path.
        run: >-
          uv run python manage.py test
          apps.analytics apps.blog apps.core apps.education apps.infosec
          -t . --verbosity 2
